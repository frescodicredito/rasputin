[project]
name = "rasputin"
version = "0.1.0"
description = "Multi-LLM Council MCP server — independent second opinions from Gemini, GPT and Mistral for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Di Credico" }]
keywords = ["mcp", "llm", "claude", "gemini", "gpt", "mistral", "code-review", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "litellm>=1.89.7,<2",
    "pyyaml>=6,<7",
    "pdfplumber>=0.11,<0.13",
    "python-docx>=1,<2",
    "python-pptx>=1,<2",
    "openpyxl>=3.1,<4",
]

[project.scripts]
rasputin = "rasputin.__main__:main"

[project.urls]
Homepage = "https://github.com/frescodicredito/rasputin"
Repository = "https://github.com/frescodicredito/rasputin"
Issues = "https://github.com/frescodicredito/rasputin/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rasputin"]
include = ["rasputin/data/*.yaml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "I", "UP"]
